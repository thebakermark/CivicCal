name: CivicCal tests

on:
  push:
    branches:
      - main
      - build/debian13-sqlite-server
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
