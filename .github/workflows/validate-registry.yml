name: Validate CivicCal registry and parser

on:
  push:
    paths:
      - "data/sources.json"
      - "scripts/**"
      - "tests/**"
      - "data/fixtures/**"
      - "docs/ics-normalization.md"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "data/sources.json"
      - "scripts/**"
      - "tests/**"
      - "data/fixtures/**"
      - "docs/ics-normalization.md"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate source registry
        run: python scripts/validate_registry.py
      - name: Run ICS parser tests
        run: python -m unittest discover -s tests -v
      - name: Parse sample calendar
        run: python scripts/parse_ics.py data/fixtures/sample-community.ics --source-id fixture
