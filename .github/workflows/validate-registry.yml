name: Validate CivicCal registry and parser

on:
  push:
    paths:
      - "data/sources.json"
      - "data/source-completeness.json"
      - "scripts/**"
      - "tests/**"
      - "data/fixtures/**"
      - "docs/ics-normalization.md"
      - "docs/source-fixture-validation.md"
      - "docs/source-completeness.md"
      - "docs/capture-to-parser.md"
      - "docs/event-normalization.md"
      - "docs/event-identity-revisions.md"
      - "docs/event-data-model.md"
      - "docs/storage-interface.md"
      - "docs/storage-architecture.md"
      - "docs/processing-pipeline.md"
      - "docs/source-completeness.md"
      - "docs/event-data-model.md"
      - "docs/storage-interface.md"
      - "docs/storage-architecture.md"
      - "docs/html-normalization.md"
      - "docs/mokena-park-adapter.md"
      - "docs/village-calendar-adapter.md"
      - ".github/workflows/validate-registry.yml"
  pull_request:
    paths:
      - "data/sources.json"
      - "scripts/**"
      - "tests/**"
      - "data/fixtures/**"
      - "docs/ics-normalization.md"
      - "docs/source-fixture-validation.md"
      - "docs/capture-to-parser.md"
      - "docs/event-normalization.md"
      - "docs/processing-pipeline.md"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate source registry
        run: python scripts/validate_registry.py
      - name: Run parser and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate initial source fixtures together
        run: python scripts/validate_source_fixtures.py
      - name: Parse sample calendar
        run: python scripts/parse_ics.py data/fixtures/sample-community.ics --source-id fixture
